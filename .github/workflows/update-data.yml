name: Update market data

on:
  workflow_dispatch:
    inputs:
      telegram_test:
        description: "Telegram 테스트 메시지 보내기"
        required: false
        default: false
        type: boolean
  schedule:
    # 미국 거래일 기준 KST 17:00~익일 08:30, 30분 간격
    # UTC 08:00~23:30 월~금. 미국 서머타임 기준 04:00 ET 프리마켓부터 포함.
    - cron: "0,30 8-23 * * 1-5"
    # 애프터마켓 종료 후 KST 09:00 최종 갱신 (UTC 00:00, 화~토)
    - cron: "0 0 * * 2-6"

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch market, macro and calendar data
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          TELEGRAM_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.telegram_test || false }}
        run: python scripts/update_data.py

      - name: Validate dashboard JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ["data/dashboard.json", "data/history.json"]:
              p = Path(name)
              if not p.exists():
                  raise SystemExit(f"missing {name}")
              with p.open(encoding="utf-8") as f:
                  json.load(f)
              print(f"valid JSON: {name}")
          PY

      - name: Commit updated data
        run: |
          git config user.name "cycle-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dashboard.json data/history.json
          git diff --cached --quiet || git commit -m "Update market radar data"
          git push
