name: Update market data

on:
  workflow_dispatch:
    inputs:
      telegram_test:
        description: "Telegram 테스트 메시지 보내기"
        required: false
        default: false
        type: boolean
  schedule:
    # 미국 거래일 기준 KST 20:00~익일 08:30, 30분 간격 (UTC 11:00~23:30)
    - cron: "0,30 11-23 * * 1-5"
    # 애프터마켓 종료 시점 KST 09:00 한 번 더 갱신 (UTC 00:00, 화~토)
    - cron: "0 0 * * 2-6"

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch market, macro and calendar data
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          TELEGRAM_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.telegram_test || false }}
        run: python scripts/update_data.py

      - name: Commit updated data
        run: |
          git config user.name "cycle-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dashboard.json data/history.json
          git diff --cached --quiet || git commit -m "Update market radar data"
          git push
