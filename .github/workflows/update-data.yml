name: Update market data

on:
  workflow_dispatch:
  schedule:
    # 평일 20:00~23:30 KST, 30분 간격 (UTC 11:00~14:30)
    - cron: "0,30 11-14 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch market, macro and calendar data
        run: python scripts/update_data.py

      - name: Commit updated data
        run: |
          git config user.name "cycle-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dashboard.json data/history.json
          git diff --cached --quiet || git commit -m "Update market radar data"
          git push
